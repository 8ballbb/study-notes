services:
  db:
    image: pgvector/pgvector:pg17
    container_name: study_notes_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: study_notes
    ports:
      - "5432:5432"
    volumes:
      - study_notes_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d study_notes"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  study_notes_pgdata:
