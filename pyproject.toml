[project]
name = "study-notes"
version = "0.1.0"
description = "Personal Obsidian study-notes CLI"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "FlagEmbedding>=1.3.0",
    "torch>=2.4",
    "mcp>=1.2,<2",
    "yt-dlp>=2025.1.1",
    "claude-agent-sdk>=0.1.0",
    "mlx-whisper>=0.4",
    "soundfile>=0.12",
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
study-notes = "study_notes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_notes"]
force-include = { "src/study_notes/schema.sql" = "study_notes/schema.sql" }

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live PostgreSQL database",
    "slow: downloads/loads the BGE-M3 model",
    "network: hits the live network (YouTube)",
    "docker: requires a running Docker daemon (Colima) for ffmpeg",
    "e2e: runs the real Claude Agent SDK engine (auth + network + DB)",
]
