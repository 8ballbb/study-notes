vault_path = "/Users/andrewpoole/vault"
notes_root = "Notes"
attachments_dir = "Attachments"
frames_subdir = "frames"

[database]
url = "postgresql://postgres:postgres@localhost:5432/study_notes"

[embedding]
model = "BAAI/bge-m3"

[models]
orchestrator = "claude-opus-4-8"
extractor = "claude-sonnet-5"
enricher = "claude-sonnet-5"

[prompts]
orchestrator = "prompts/orchestrator.md"
note_writing = "prompts/note-writing.md"
enrichment = "prompts/enrichment.md"
anti_slop = "prompts/anti-slop.md"

[run]
dry_run = false

[frames]
budget = 4          # per-cue/window candidate cap (extractor targets narrow moments, not whole topics)
enabled = true

[whisper]
model = "mlx-community/whisper-small"

[browser]
profile = "~/.study-notes/browser"
timeout_ms = 30000
headless = true

# Route matching hosts through a reader/mirror to bypass paywalls. The page is
# FETCHED via the mirror, but the note's source/resource stays the ORIGINAL
# article URL. `{url}` is replaced with the original URL. Mirror domains rotate —
# swap `via` when one stops working (Freedium in particular re-mirrors often).
[paywall]
rules = [
  { hosts = ["medium.com", "towardsdatascience.com", "betterprogramming.pub", "levelup.gitconnected.com"], via = "https://freedium.cfd/{url}" },
]
# More services you can add to `rules` above (list the hosts you actually hit):
#   general news → archive.today:  { hosts = ["nytimes.com", "bloomberg.com"], via = "https://archive.ph/newest/{url}" }
#   alt reader   → SMRY.ai:        { hosts = ["theatlantic.com"], via = "https://smry.ai/{url}" }
