vault_path = "/Users/andrewpoole/vault"
notes_root = "Notes"
attachments_dir = "Attachments"
frames_subdir = "frames"

[database]
url = "postgresql://postgres:postgres@localhost:5432/study_notes"

[embedding]
model = "BAAI/bge-m3"

[models]
orchestrator = "claude-opus-4-8"
extractor = "claude-sonnet-5"
enricher = "claude-sonnet-5"

[prompts]
orchestrator = "prompts/orchestrator.md"
note_writing = "prompts/note-writing.md"
enrichment = "prompts/enrichment.md"
anti_slop = "prompts/anti-slop.md"

[run]
dry_run = false

[frames]
budget = 4          # per-cue/window candidate cap (extractor targets narrow moments, not whole topics)
enabled = true

[whisper]
model = "mlx-community/whisper-small"
