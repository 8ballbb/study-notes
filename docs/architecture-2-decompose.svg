</text>
<text x="50.0" y="791.1" font-size="14" font-family="Helvetica, Arial, sans-serif" fill="#1e1e2e" text-anchor="middle">
<tspan x="50.0" dy="0">prepare_video once</tspan>
<tspan x="50.0" dy="17.5">≤480p, shared by workers</tspan>
</text>
<text x="540.0" y="928.8" font-size="12" font-family="Helvetica, Arial, sans-serif" fill="#1e1e2e" text-anchor="middle">
