<text x="540.0" y="663.6" font-size="14" font-family="Helvetica, Arial, sans-serif" fill="#1e1e2e" text-anchor="middle">
<tspan x="540.0" dy="0">resolve placement per topic</tspan>
<tspan x="540.0" dy="17.5">list_categories + vault_search → new note or merge</tspan>
</text>
<text x="540.0" y="798.8" font-size="12" font-family="Helvetica, Arial, sans-serif" fill="#1e1e2e" text-anchor="middle">
