vault_path = "/tmp/vault"
notes_root = "Notes"
attachments_dir = "Attachments"
frames_subdir = "frames"

[database]
url = "postgresql://localhost/study_notes_test"

[embedding]
model = "BAAI/bge-m3"

[models]
orchestrator = "claude-opus-4-8"
extractor = "claude-sonnet-5"
enricher = "claude-sonnet-5"

[prompts]
orchestrator = "prompts/orchestrator.md"
note_writing = "prompts/note-writing.md"
enrichment = "prompts/enrichment.md"
anti_slop = "prompts/anti-slop.md"

[run]
dry_run = false

[frames]
budget = 4
enabled = true

[whisper]
model = "mlx-community/whisper-small"

[browser]
profile = "~/.study-notes/browser"
timeout_ms = 30000
headless = true

[paywall]
rules = [
  { hosts = ["medium.com", "towardsdatascience.com"], via = "https://freedium.cfd/{url}" },
]
